name: Publint

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'package-lock.json'
      - 'package.json'
      - 'tsdown.config.ts'

jobs:
  publint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build && npx publint
