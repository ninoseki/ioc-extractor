name: Publint

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'package-lock.json'
      - 'package.json'
      - 'tsdown.config.ts'

jobs:
  publint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Use Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build && npx publint
